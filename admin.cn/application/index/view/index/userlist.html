<!DOCTYPE html>
<html class="x-admin-sm">
    <head>
        <meta charset="UTF-8">
        <title>欢迎页面-X-admin2.2</title>
        <meta name="renderer" content="webkit">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
        <link rel="stylesheet" href="__CSS__/font.css">
        <link rel="stylesheet" href="__CSS__/xadmin.css">
        <script src="__LIB__/layui/layui.js" charset="utf-8"></script>
        <script type="text/javascript" src="__JS__/xadmin.js"></script>
        <!--<script src="__LIB__/bootstrap/js/bootstrap.js"></script>-->
        <link rel="stylesheet" href="__LIB__/bootstrap/css/bootstrap.css">
        <!--[if lt IE 9]>
          <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
          <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
        <![endif]-->
    </head>
    <body>
        <div class="x-nav">
          <!--<span class="layui-breadcrumb">-->
            <!--<a href="">首页</a>-->
            <!--<a href="">演示</a>-->
            <!--<a>-->
              <!--<cite>导航元素</cite></a>-->
          <!--</span>-->
          <a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right" onclick="location.reload()" title="刷新">
            <i class="layui-icon layui-icon-refresh" style="line-height:30px"></i></a>
        </div>
        <div class="layui-fluid">
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md12">
                    <div class="layui-card">
                        <div class="layui-card-body ">
                            <button class="layui-btn" onclick="xadmin.open('添加用户','{:url(\'adduser\')}',800,400)"><i class="iconfont">&#xe6b9;</i>添加</button>
                                <!--<div class="layui-inline layui-show-xs-block">-->
                                    <!--<input class="layui-input"  autocomplete="off" placeholder="开始日" name="start" id="start">-->
                                <!--</div>-->
                                <!--<div class="layui-inline layui-show-xs-block">-->
                                    <!--<input class="layui-input"  autocomplete="off" placeholder="截止日" name="end" id="end">-->
                                <!--</div>-->

                                <!--<button class="layui-btn layui-btn-danger" onclick="delAll()"><i class="layui-icon"></i>批量删除</button>-->
                                <div class="layui-inline layui-show-xs-block">
                                    <input type="text" name="searchword"  placeholder="请输入用户ID或昵称" autocomplete="off" class="layui-input">
                                </div>
                                <div class="layui-inline layui-show-xs-block" onclick="dosearch()">
                                    <button class="layui-btn"  lay-submit="" lay-filter="sreach"><i class="layui-icon">&#xe615;</i></button>
                                </div>

                        </div>
                        <div class="layui-card-body layui-table-body layui-table-main" id="tablebox">
                            <table class="layui-table layui-form" id="pretable">
                                <thead>
                                  <tr>
                                    <!--<th>-->
                                      <!--<input type="checkbox" lay-filter="checkall" name="" lay-skin="primary">-->
                                    <!--</th>-->
                                    <th>用户ID</th>
                                    <th>昵称</th>
                                    <th>性别</th>
                                      <th>手机号</th>
                                    <th>现居</th>
                                    <th>距离值</th>
                                    <!--<th>认证与否</th>-->
                                    <th>状态</th>
                                    <th>操作</th></tr>
                                </thead>
                                <tbody>
                                {volist name="users" id="user"}
                                  <tr>
                                    <!--<td>-->
                                      <!--<input type="checkbox" name="id" value="1"   lay-skin="primary">-->
                                    <!--</td>-->
                                    <td>{$user.uname}</td>
                                    <td>{$user.nickname}</td>
                                      {if condition="$user.sex eq 1"}
                                          <td>男</td>
                                      {else /}
                                          <td>女</td>
                                      {/if}
                                      <td>{$user.phone}</td>
                                    <td>{$user.location}</td>
                                    <td>{$user.distance} km</td>
                                      <!--{if condition="$user.certified eq 0"}-->
                                      <!--<td>未认证</td>-->
                                      <!--{else /}-->
                                      <!--<td>已认证</td>-->
                                      <!--{/if}-->
                                    <td class="td-status">
                                        {if condition="$user.status eq 1"}
                                           <span class="layui-btn layui-btn-normal layui-btn-mini" onclick="member_stop(this,{$user.uname})" href="javascript:;"  title="冻结">正常</span></td>
                                        {else /}
                                          <span class="layui-btn layui-btn-disabled layui-btn-mini" onclick="member_stop(this,{$user.uname})" href="javascript:;"  title="启用">已冻结</span></td>
                                        {/if}
                                    <td class="td-manage">
                                      <a title="查看详细资料"  onclick="xadmin.open('查看详细资料','{:url(\'/index/index/userInfo/uid/\'.$user.uname)}',600,500)" href="javascript:;">
                                        <i class="layui-icon">&#xe642;</i>
                                      </a>
                                      <a title="重置密码为123456" onclick="resetpwd({$user.uname})" href="javascript:;">
                                        <i class="layui-icon">&#xe6b2;</i>
                                      </a>
                                      <a title="删除" onclick="member_del(this,{$user.uname})" href="javascript:;">
                                        <i class="layui-icon">&#xe640;</i>
                                      </a>
                                    </td>
                                  </tr>
                                {/volist}
                                </tbody>
                            </table>
                        </div>
                        <div class="text-center text-info" id="prepage">
                            {$users->render()}
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </body>
    <script>
      layui.use(['laydate','form'], function(){
        var laydate = layui.laydate;
        var  form = layui.form;
        // 监听全选
        form.on('checkbox(checkall)', function(data){
          if(data.elem.checked){
            $('tbody input').prop('checked',true);
          }else{
            $('tbody input').prop('checked',false);
          }
          form.render('checkbox');
        });
        //执行一个laydate实例
        laydate.render({
          elem: '#start' //指定元素
        });
        //执行一个laydate实例
        laydate.render({
          elem: '#end' //指定元素
        });
      });

//搜搜用户
      function dosearch() {
          let word = $('[ name="searchword"]').val()
          console.log(word)
          if(!word){
              return;
          }else{
              $.post("{:url('searchuser')}",{'word': word},function (res) {
                  console.log(res)
                  if(res.status == 200 && res.data && res.data.length>0){
                      $('#pretable').remove()
                      $('#prepage').remove();
                      let _html = `<table class="layui-table layui-form" id="pretable">
                                <thead>
                                  <tr>
                          <th>用户ID</th>
                          <th>昵称</th>
                          <th>性别</th>
                          <th>手机号</th>
                          <th>现居</th>
                          <th>距离值</th>
                          <th>状态</th>
                          <th>操作</th></tr>
                          </thead>
                          <tbody>`
                          for(let i=0;i<res.data.length;i++){
                          let item = res.data[i]
                          _html +=`<tr>
                          <td>${item.uname}</td>
                          <td>${item.nickname}</td>`
                          if(item.sex == 1)
                              {
                                  _html += `<td>男</td>`
                              }else{
                          _html += `<td>女</td>`
                          }
                         _html += `<td>${item.phone}</td><td>${item.location}</td>
                          <td>${item.distance} km</td>`
                         _html +=` <td class="td-status">`
                         if(item.status == 1){
                          _html += ` <span class="layui-btn layui-btn-normal layui-btn-mini" onclick="member_stop(this,${item.uname})" href="javascript:;"  title="冻结">正常</span></td>`
                          }else{
                         _html += ` <span class="layui-btn layui-btn-disabled layui-btn-mini" onclick="member_stop(this,${item.uname})" href="javascript:;"  title="启用">已冻结</span></td>`
                         }
                         _html += `<td class="td-manage">
                          <a title="查看详细资料"  onclick="xadmin.open('查看详细资料','/public/index.php/index/index/userInfo/uid/'+${item.uname},600,400)" href="javascript:;">
                          <i class="layui-icon">&#xe642;</i>
                          </a>
                          <a onclick="resetpwd(${item.uname})" href="javascript:;">
                          <i class="layui-icon">&#xe6b2;</i>
                          </a>
                          <a title="删除" onclick="member_del(this,${item.uname})" href="javascript:;">
                          <i class="layui-icon">&#xe640;</i>
                          </a>
                          </td>
                          </tr>`
                          }
                         _html +=` </tbody>
                          </table>`
                      $('#tablebox').html(_html)
                  }else{
                      layer.msg('没有更多结果了',{icon: 0, time: 1000})
                  }
              })
          }
      }
       /*用户-停用*/
      function member_stop(obj,id){
          if($(obj).attr('title')=='冻结'){
              layer.confirm('确认要停用吗？',function(index) {
                  //发异步把用户状态进行更改
                  $.post("{:url('changeUserStatue')}",{'uid':id},function (res) {
                      console.log(res)
                  })
                  $(obj).attr('title', '启用')
                  $(obj).find('i').html('&#xe62f;');

                  $(obj).parents("tr").find(".td-status").find('span').addClass('layui-btn-disabled').html('已冻结');
                  layer.msg('已冻结!', {icon: 5, time: 1000});
              })
          }else{
              layer.confirm('确认要启用吗？',function(index) {
                  $.post("{:url('changeUserStatue')}",{'uid':id},function (res) {
                      console.log(res)
                  })
                  $(obj).attr('title', '冻结')
                  $(obj).find('i').html('&#xe601;');
                  $(obj).parents("tr").find(".td-status").find('span').removeClass('layui-btn-disabled').html('正常');
                  layer.msg('已启用!', {icon: 6, time: 1000});
              })
          }
      }

//      重置密码
      function  resetpwd(uid) {
          layer.confirm('确认重置密码？', function () {
              $.post("{:url('resetPwd')}", {uid: uid}, function (res) {
                  if(res.status == 200){
                      layer.msg('已重置!',{icon:1,time:1000});
                  }else{
                      layer.msg('密码已是 123456 !',{icon:2,time:2000});
                  }
              })
          })
      }

      /*用户-删除*/
      function member_del(obj,id){
          layer.confirm('确认要删除吗？',function(index){
              //发异步删除数据
              $.post("{:url('delUser')}",{uid: id},function (res) {
                  if(res.status == 200){
                      $(obj).parents("tr").remove();
                      layer.msg('已删除!',{icon:1,time:1000});
                  }else{
                      layer.msg('请重试!',{icon:1,time:1000});
                  }
              })

          });
      }

      function delAll (argument) {
        var ids = [];
        // 获取选中的id 
        $('tbody input').each(function(index, el) {
            if($(this).prop('checked')){
               ids.push($(this).val())
            }
        });
        layer.confirm('确认要删除吗？'+ids.toString(),function(index){
            //捉到所有被选中的，发异步进行删除
            layer.msg('删除成功', {icon: 1});
            $(".layui-form-checked").not('.header').parents('tr').remove();
        });
      }
    </script>
</html>
