<!DOCTYPE html>
<html class="x-admin-sm">

<head>
    <meta charset="UTF-8">
    <title>欢迎页面-X-admin2.2</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
    <link rel="stylesheet" href="__CSS__/font.css">
    <link rel="stylesheet" href="__CSS__/xadmin.css">
    <script src="__LIB__/layui/layui.js" charset="utf-8"></script>
    <script type="text/javascript" src="__JS__/xadmin.js"></script>
    <script src="__JS__/jquery.js"></script>
    <!--<script src="__LIB__/bootstrap/js/bootstrap.js"></script>-->
    <link rel="stylesheet" href="__LIB__/bootstrap/css/bootstrap.css">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
    <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
    <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<form class="form-horizontal" style="margin-top:45px;">
    <div class="form-group">
        <label for="" class="col-xs-2 col-xs-offset-2 control-label">大冒险问题：</label>
        <div class="col-xs-5 col-md-6">
            <div contenteditable="true" id="question" style="border: 1px solid #fff;
    height: 150px;
    width: 400px;
    background: #ddd;
    padding: 10px;
    font-size: 15px;">{$q.content}</div>
        </div>
    </div>
    <div class="form-group">
        <div class="col-xs-offset-4 col-xs-10">
            <input type="hidden" name="" id="qid" value="{$q.id}">
            <button type="" class="btn btn-primary" id="add">确定修改</button>
            <button type="" id="resetbtn" class="col-xs-offset-1 btn btn-warn">重置</button>
        </div>
    </div>
</form>
<script>
    layui.use(['form', 'layer','jquery'], function() {
        $ = layui.jquery;
        var form = layui.form,
            layer = layui.layer;

        //自定义验证规则
        form.verify({
            nikename: function(value) {
                if (value.length < 5) {
                    return '昵称至少得5个字符啊';
                }
            },
            pass: [/(.+){6,12}$/, '密码必须6到12位'],
            repass: function(value) {
                if ($('#L_pass').val() != $('#L_repass').val()) {
                    return '两次密码不一致';
                }
            }
        });

        //监听提交
        form.on('submit(add)',
            function(data) {
                console.log(data);
                //发异步，把数据提交给php
                layer.alert("增加成功", {
                        icon: 6
                    },
                    function() {
                        //关闭当前frame
                        xadmin.close();

                        // 可以对父窗口进行刷新
                        xadmin.father_reload();
                    });
                return false;
            });

    });
    layui.use('laydate', function(){
        var laydate = layui.laydate;

        //执行一个laydate实例
        laydate.render({
            elem: '#bir' //指定元素
        });
    });
    $('#resetbtn').click(function (e) {
        e.preventDefault()
        $('#question').text('')
    })
    $('#add').click(function (e) {
        e.preventDefault()
        let q = $('#question').text()
        $.post("{:url('doupdateq')}",{
            qid: $('#qid').val(),
            newval: q
        },function (res) {
            if(res.status == 200){
                layer.msg('添加成功!',{icon:1,time:1000});
                setTimeout(function () {
                    var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index);
                },1000)
            }
        })
    })
</script>
</body>
</html>
