    let infos = [];
    layui.use(['form', 'layer','jquery'], function() {
        $ = layui.jquery;
        var form = layui.form,
            layer = layui.layer;
    });
    let firstnum;
    $.get('{:url("retnum")}',function(res){
        firstnum = res.number;  //最后一条记录的number值或者0
    });

    $('#reset').click(function () {
        window.location.href = window.location.href
        $.get('{:url("retnum")}',function(res){
            firstnum = res.number;  //最后一条记录的number值或者0
        });
    })

    $('#create').click(function () {
        var index = layer.load(1, {
            shade: [0.1,'#fff'] //0.1透明度的白色背景
            ,time: 900000
        });
        $('#box').html('')
        $.get('{:url("retnum")}',function(res){
            firstnum = res.number;  //最后一条记录的number值或者0
        });
        let text =  $('#content').val() ||"http://app.tiaociapp.com/public/index.php?s=/index/Extrafun/scan";  /// '/number+number+'/token/9c05d4623d200b9fd80c04bdd1331569( md5(tiaociapp&youfankeji
        let num = $('#num').val();
        if(num<=0 || num == ''){
            return;
        }
        let tokens = [], numbers = [];
        for(let i=1;i<=num;i++){
            let number = firstnum + i
            let node = document.createElement('div')
            node.setAttribute("id",'node'+i)
            node.setAttribute('class','node')
            node.setAttribute('data-number',number)
            node.setAttribute('style','border:5px solid #fff')
            $('#box').append(node)

            if(number.toString().length == 1){
                number = '0000'+number
            }else if(number.toString().length == 2){
                number = '000'+number
            }else if(number.toString().length == 3){
                number = '00'+number
            }else if(number.toString().length == 4){
                number = '0'+number
            }else{
                number = number
            }
            let token = b64_md5( ((new Date()).valueOf()).toString() + number )
            numbers.push(number)
            tokens.push(token)
        }
       let timer =  setInterval(function () {
            if($('.node').length == num){
                // alert(123)
                clearInterval(timer)
                $.post('{:url("generateQrcode")}',{
                        number: numbers.toString(),
                        token: tokens.toString()
                    },function(ret, err) {
                        if (ret) {
                            if(ret.status == 200){
                                // console.log(ret.data)
                                gcode(text,ret)
                            }else{
                                layer.msg('发生错误，请联系管理员处理!', {icon: 2, time: 1000});
                            }
                        } else {
                            console.log(JSON.stringify(err));
                        }
                    })
            }
        },500)
        $('#create').remove()
    })

    function gcode(text,ret){
        // console.log(ret)
        let numbers = ret.data.numbers
        let tokens = ret.data.tokens
        if(numbers.length == tokens.length){
            for(let i=0,len=tokens.length;i<len;i++){
                infos.push({
                    '' : 'http://app.tiaociapp.com/public/index.php?s=/index/Extrafun/scan/number/'+numbers[i] + '/token/'+tokens[i]
                })
            }
            // console.log(infos)
            let s = []
            for(let i=0,len=numbers.length;i<len;i++){
                let text = 'http://app.tiaociapp.com/public/index.php?s=/index/Extrafun/scan'+'/number/'+numbers[i] + '/token/'+tokens[i]    //
                s[i] = QRCode.generatePNG(text, {
                    ecclevel: "M",
                    format: "html",
                    fillcolor: "#fff",
                    textcolor: "#000",
                    margin: 3,
                    modulesize: 8
                });
                let dataUriPngImage = document.createElement('img')
                dataUriPngImage.setAttribute("src",s[i])
                dataUriPngImage.setAttribute("style",'width: 150px;height: 150px')
                // console.log(dataUriPngImage)
                $("#node"+parseInt(i+1)).html(dataUriPngImage)

                // $("#node"+parseInt(i+1)).qrcode({
                //     render : "canvas",    //
                //     text : text+'/number/'+numbers[i] + '/token/'+tokens[i],    //
                //     width : "190",               //��ά��
                //     height : "190",              //��ά��ĸ߶�
                //     background : "#00BFFF",       //��ά��ĺ�ɫ
                //     foreground : "#000",        //��ά���ǰ��ɫ
                //     // src: 'photo.jpg'             //��ά���м��ͼƬ
                // });
            }
            $('#export').show()
            $('#down').show()
            $('.layui-layer-shade,.layui-layer-content').hide()
        }
    }


    //导出Excel表
    function downloadExl() {
        let data = infos;
        // console.log(data)
        var keys = Object.keys(data[0]);
        // var firstRow = {};
        // keys.forEach(function (item) {
        //     firstRow[item] = item;
        // });
        // data.unshift(data[0]);

        var content = {};

        // 把json格式的数据转为excel的行列形式
        var sheetsData = data.map(function (item, rowIndex) {
            return keys.map(function (key, columnIndex) {
                return Object.assign({}, {
                    value: item[key],
                    position: (columnIndex > 25 ? getCharCol(columnIndex) : String.fromCharCode(65 + columnIndex)) + (rowIndex + 1),
                });
            });
        }).reduce(function (prev, next) {
            return prev.concat(next);
        });

        sheetsData.forEach(function (item, index) {
            content[item.position] = { v: item.value };
        });

        //设置区域,比如表格从A1到D10,SheetNames:标题，
        var coordinate = Object.keys(content);
        var workBook = {
            SheetNames: ["qrcode"],
            Sheets: {
                "qrcode": Object.assign({}, content, { "!ref": coordinate[0] + ":" + coordinate[coordinate.length - 1] }),
            }
        };
        //这里的数据是用来定义导出的格式类型
        var excelData = XLSX.write(workBook, { bookType: "xlsx", bookSST: false, type: "binary" });
        var blob = new Blob([string2ArrayBuffer(excelData)], { type: "" });
        saveAs(blob, "二维码链接记录表.xlsx");
    }
    //字符串转字符流
    function string2ArrayBuffer(s) {
        var buf = new ArrayBuffer(s.length);
        var view = new Uint8Array(buf);
        for (var i = 0; i != s.length; ++i) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
    }
    // 将指定的自然数转换为26进制表示。映射关系：[0-25] -> [A-Z]。
    function getCharCol(n) {
        let temCol = "",
            s = "",
            m = 0
        while (n > 0) {
            m = n % 26 + 1
            s = String.fromCharCode(m + 64) + s
            n = (n - m) / 26
        }
        return s
    }

        let nodes = $('div.node')
        // console.log($(nodes[0]).attr('data-number'))
        let imgBase64 = [];
        let numbers = [];
        let ziper = new JSZip();
        let img = ziper.folder('imgs')  //创建存储其的imgs文件夹
        for (let i=0,len=nodes.length; i<len; i++){
            let _canvas =  $("#node" + parseInt(i+1)).find("img")[0];
            imgBase64.push($(_canvas).attr('src').substring(22));
            // console.log(imgBase64)
            numbers.push($(nodes[i]).attr('data-number'))
        }
        function tt(){
            setTimeout(function(){
                if(nodes.length == imgBase64.length){
                    for(var i=0;i<nodes.length;i++){
                        img.file(numbers[i]+'.png', imgBase64[i], {base64: true});
                    }
                    ziper.generateAsync({type:"blob"}).then(function(content) {
                        saveAs(content, "qrcodes.zip");
                    });
                    $('#status').text('处理完成。。。。。');

                }else{
                    $('#status').text('已完成：'+imgBase64.length+'/'+nodes.length);
                    tt();
                }
            },100);

        }
        tt();
    })
