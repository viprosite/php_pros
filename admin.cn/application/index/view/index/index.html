<!doctype html>
<html  class="x-admin-sm">
<head>
	<meta charset="UTF-8">
	<title>后台登录-挑刺APP</title>
	<meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="stylesheet" href="__CSS__/font.css">
    <link rel="stylesheet" href="__CSS__/login.css">
	  <link rel="stylesheet" href="__CSS__/xadmin.css">
    <script type="text/javascript" src="https://cdn.bootcss.com/jquery/3.2.1/jquery.min.js"></script>
    <script src="__STATIC__/lib/layui/layui.js" charset="utf-8"></script>
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body class="login-bg">
    
    <div class="login layui-anim layui-anim-up">
        <div class="message" style="background-color: #FA2C66">挑刺APP-管理登录</div>
        <div id="darkbannerwrap"></div>
        
        <form class="layui-form" >
            <input name="username" placeholder="用户名" id="username" type="text" lay-verify="required" class="layui-input" >
            <hr class="hr15">
            <input name="password" lay-verify="required" id="pwd" placeholder="密码"  type="password" class="layui-input">
            <hr class="hr15">
            <input value="登录" lay-submit lay-filter="login" style="width:100%;background-color: #FA2C66" type="submit">
            <hr class="hr20" >
        </form>
    </div>

    <!--<script src="__LIB__/layer/layer.js"></script>-->
    <script>
        $(function  () {
            layui.use('form', function(){
              var form = layui.form;

            });
            $('[type="submit"]').click(function (e) {
                e.preventDefault()
                let username = $('#username').val()
                let pwd = $('#pwd').val()
                if(!username || !pwd){
                    return;
                }
                $.post("{:url('/index/index/dologin')}",{'username':username, 'pwd': pwd},function (res) {
                    switch(res.status){
                        case 200:
                            layui.use('layer', function(){
                                var layer = layui.layer;
                                layer.msg('登陆成功',{icon: 6});
                            });
                            setTimeout(function () {
                                window.location.href = "{:url('index/index/home')}"
                            },1500);break;
                        case 202:
                            layui.use('layer', function(){
                                var layer = layui.layer;
                                layer.msg('用户名不存在',{icon: 0});
                            });
                            break;
                        case 203:
                            layui.use('layer', function(){
                                var layer = layui.layer;
                                layer.msg('密码错误',{icon: 2});
                            });
                            break;
                    }
                })
            })
        })
    </script>
    <!-- 底部结束 -->
</body>
</html>
